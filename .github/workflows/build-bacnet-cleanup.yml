name: Build BACnet cleanup branch

on:
  push:
    branches:
      - build/cleanup-bacnet-thing-model
  workflow_dispatch:

jobs:
  build-kar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ConnectorIO cleanup build branch
        uses: actions/checkout@v4
        with:
          path: connectorio-addons

      - name: Checkout tested BACnet4J wrapper
        uses: actions/checkout@v4
        with:
          repository: bagaMann/bacnet4j-wrapper
          ref: stable/bacnet-tested-2026-10-01
          path: bacnet4j-wrapper

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install BACnet4J wrapper
        working-directory: bacnet4j-wrapper
        run: mvn -U -pl api,ip,mstp -am install -DskipTests

      - name: Build BACnet KAR
        working-directory: connectorio-addons
        run: |
          mvn -U -Popenhab \
            -pl kars/org.connectorio.addons.kar.bacnet \
            -am package -DskipTests

      - name: Verify legacy object Things are gone
        working-directory: connectorio-addons
        run: |
          set -euo pipefail
          test ! -f bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/thing/thing-types.xml
          ! grep -R 'name="discoverObjects"' bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/thing
          ! grep -R 'BACnetObjectThingHandler' bundles/org.connectorio.addons.binding.bacnet/src/main/java/org/connectorio/addons/binding/bacnet/internal/BACnetThingHandlerFactory.java
          ls -lh kars/org.connectorio.addons.kar.bacnet/target/*.kar

      - name: Upload KAR
        uses: actions/upload-artifact@v4
        with:
          name: bacnet-cleanup-thing-model
          path: connectorio-addons/kars/org.connectorio.addons.kar.bacnet/target/*.kar
          if-no-files-found: error
          retention-days: 30
