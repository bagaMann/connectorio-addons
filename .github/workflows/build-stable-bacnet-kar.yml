name: Build stable BACnet KAR

on:
  push:
    branches:
      - build/stable-cov-health-2026-09-19
  workflow_dispatch:

jobs:
  build-kar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout ConnectorIO stable build branch
        uses: actions/checkout@v4
        with:
          path: connectorio-addons

      - name: Checkout BACnet4J wrapper stable branch
        uses: actions/checkout@v4
        with:
          repository: bagaMann/bacnet4j-wrapper
          ref: stable/cov-health-2026-09-19
          path: bacnet4j-wrapper

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install stable BACnet4J wrapper
        working-directory: bacnet4j-wrapper
        run: |
          mvn -U -pl api,ip,mstp -am install -DskipTests

      - name: Build stable BACnet KAR
        working-directory: connectorio-addons
        run: |
          mvn -U -Popenhab \
            -pl kars/org.connectorio.addons.kar.bacnet \
            -am package -DskipTests

      - name: Collect KAR and checksum
        working-directory: connectorio-addons
        run: |
          mkdir -p artifacts
          cp kars/org.connectorio.addons.kar.bacnet/target/*.kar artifacts/
          cd artifacts
          sha256sum *.kar > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload stable BACnet KAR
        uses: actions/upload-artifact@v4
        with:
          name: bacnet-kar-stable-cov-health-2026-09-19
          path: |
            connectorio-addons/artifacts/*.kar
            connectorio-addons/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish permanent GitHub release
        working-directory: connectorio-addons
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: bacnet-stable-cov-health-2026-09-19
          STABLE_SHA: e35f8bd2b1b861d5fbcaf10729578ab25e2fe8ae
        run: |
          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$STABLE_TAG" artifacts/*.kar artifacts/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$STABLE_TAG" artifacts/*.kar artifacts/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$STABLE_SHA" \
              --title "BACnet stable COV + health 2026-09-19" \
              --notes "Verified stable baseline: COV Present_Value, COV Status_Flags and BACnet device health monitoring. Wrapper source: bagaMann/bacnet4j-wrapper stable/cov-health-2026-09-19 at 0d31e70a915d1a45206dfff34f3280f48855e17d. ConnectorIO source: stable/cov-health-2026-09-19 at e35f8bd2b1b861d5fbcaf10729578ab25e2fe8ae."
          fi
