name: Build BACnet fixed channel properties

on:
  push:
    branches:
      - build/bacnet-fixed-channel-properties
  workflow_dispatch:

jobs:
  build-kar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ConnectorIO
        uses: actions/checkout@v4
        with:
          path: connectorio-addons

      - name: Checkout tested BACnet4J wrapper
        uses: actions/checkout@v4
        with:
          repository: bagaMann/bacnet4j-wrapper
          ref: stable/bacnet-tested-2026-10-01
          path: bacnet4j-wrapper

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install BACnet4J wrapper
        working-directory: bacnet4j-wrapper
        run: mvn -U -pl api,ip,mstp -am install -DskipTests

      - name: Build BACnet KAR
        working-directory: connectorio-addons
        run: |
          mvn -U -Popenhab \
            -pl kars/org.connectorio.addons.kar.bacnet \
            -am package -DskipTests

      - name: Verify fixed channel property model
        working-directory: connectorio-addons
        run: |
          set -euo pipefail
          CFG=bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/config/channel-config.xml
          BR=bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/thing/bridge.xml
          CH=bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/thing/channels.xml
          DEV=bundles/org.connectorio.addons.binding.bacnet/src/main/java/org/connectorio/addons/binding/bacnet/internal/handler/object/BACnetDeviceHandler.java

          test "$(grep -c 'name="propertyIdentifier"' "$CFG" || true)" -eq 0
          grep -q 'deviceWriteableOutOfService' "$CH"
          grep -q 'deviceWriteableOutOfService' "$BR"
          grep -q 'resolvePropertyIdentifier' "$DEV"
          grep -q 'new com.serotonin.bacnet4j.type.primitive.Boolean' "$DEV"
          grep -q 'Ignoring write command .* read-only BACnet channel' "$DEV"

          ls -lh kars/org.connectorio.addons.kar.bacnet/target/*.kar
