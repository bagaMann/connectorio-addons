name: Build BACnet Weekly Schedule

on:
  push:
    branches:
      - build/bacnet-weekly-schedule
  workflow_dispatch:

jobs:
  build-kar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: connectorio-addons
      - uses: actions/checkout@v4
        with:
          repository: bagaMann/bacnet4j-wrapper
          ref: stable/bacnet-tested-2026-10-01
          path: bacnet4j-wrapper
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install wrapper
        working-directory: bacnet4j-wrapper
        run: mvn -U -pl api,ip,mstp -am install -DskipTests

      - name: Build KAR
        working-directory: connectorio-addons
        run: |
          mvn -U -Popenhab             -pl kars/org.connectorio.addons.kar.bacnet             -am package -DskipTests

      - name: Verify Weekly Schedule support
        working-directory: connectorio-addons
        run: |
          set -euo pipefail
          H=bundles/org.connectorio.addons.binding.bacnet/src/main/java/org/connectorio/addons/binding/bacnet/internal/handler/object/BACnetDeviceHandler.java
          V=bundles/org.connectorio.addons.binding.bacnet/src/main/java/org/connectorio/addons/binding/bacnet/internal/handler/object/BACnetValueConverter.java
          C=bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/thing/channels.xml
          CFG=bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/config/channel-config.xml
          B=bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/thing/bridge.xml
          T=bundles/org.connectorio.addons.temporal.item/src/main/java/org/connectorio/addons/temporal/item/TemporalItemFactory.java

          grep -q '<item-type>WeekSchedule</item-type>' "$C"
          grep -q 'device-week-schedule-read-write' "$CFG"
          grep -q 'deviceWriteableWeekSchedule' "$B"
          grep -q 'PropertyIdentifier.weeklySchedule' "$H"
          grep -q 'Type.SCHEDULE' "$H"
          grep -q 'time.getNano() / 10_000_000' "$V"
          grep -q 'WEEK_SCHEDULE = "WeekSchedule"' "$T"
          ls -lh kars/org.connectorio.addons.kar.bacnet/target/*.kar
