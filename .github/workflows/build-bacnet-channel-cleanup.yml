name: Build BACnet channel type cleanup

on:
  push:
    branches:
      - build/cleanup-bacnet-channel-types
  workflow_dispatch:

jobs:
  build-kar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ConnectorIO cleanup branch
        uses: actions/checkout@v4
        with:
          path: connectorio-addons

      - name: Checkout tested BACnet4J wrapper
        uses: actions/checkout@v4
        with:
          repository: bagaMann/bacnet4j-wrapper
          ref: stable/bacnet-tested-2026-10-01
          path: bacnet4j-wrapper

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install BACnet4J wrapper
        working-directory: bacnet4j-wrapper
        run: mvn -U -pl api,ip,mstp -am install -DskipTests

      - name: Build BACnet KAR
        working-directory: connectorio-addons
        run: |
          mvn -U -Popenhab \
            -pl kars/org.connectorio.addons.kar.bacnet \
            -am package -DskipTests

      - name: Verify exposed channel types
        working-directory: connectorio-addons
        run: |
          set -euo pipefail
          XML=bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/thing/bridge.xml
          EXPECT='deviceWriteableBinary,deviceWriteableNumber,deviceWriteableDateTime,deviceWriteableText,deviceReadableStatusFlags,deviceReadableEventState,deviceReadableOutOfService'
          test "$(grep -o "extensible=\"$EXPECT\"" "$XML" | wc -l)" -eq 2

          CHANNELS=bundles/org.connectorio.addons.binding.bacnet/src/main/resources/OH-INF/thing/channels.xml
          grep -q 'Present value — Binary' "$CHANNELS"
          grep -q 'Present value — Number' "$CHANNELS"
          grep -q 'Present value — Date/Time' "$CHANNELS"
          grep -q 'Present value — Text' "$CHANNELS"

          ls -lh kars/org.connectorio.addons.kar.bacnet/target/*.kar
