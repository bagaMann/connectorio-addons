name: Build BACnet KAR hotfix with BACnet4J 6.1 wrapper

on:
  push:
    branches:
      - build/hotfix-kar-bacnet61-wrapper-2026-09-20
  workflow_dispatch:

jobs:
  build-kar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout ConnectorIO hotfix build branch
        uses: actions/checkout@v4
        with:
          path: connectorio-addons

      - name: Checkout BACnet4J wrapper stable branch
        uses: actions/checkout@v4
        with:
          repository: bagaMann/bacnet4j-wrapper
          ref: stable/bbmd-foreign-device-2026-09-19
          path: bacnet4j-wrapper

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install BACnet4J wrapper
        working-directory: bacnet4j-wrapper
        run: |
          mvn -U -pl api,ip,mstp -am install -DskipTests

      - name: Build BACnet KAR
        working-directory: connectorio-addons
        run: |
          mvn -U -Popenhab \
            -pl kars/org.connectorio.addons.kar.bacnet \
            -am package -DskipTests

      - name: Verify packaged wrapper versions and exports
        working-directory: connectorio-addons
        run: |
          set -euo pipefail
          KAR=$(ls kars/org.connectorio.addons.kar.bacnet/target/*.kar | head -1)
          rm -rf /tmp/kar-check
          mkdir -p /tmp/kar-check
          unzip -q "$KAR" -d /tmp/kar-check

          test -f /tmp/kar-check/repository/org/code-house/bacnet4j/api/1.3.0-SNAPSHOT/api-1.3.0-SNAPSHOT.jar
          test -f /tmp/kar-check/repository/org/code-house/bacnet4j/ip/1.3.0-SNAPSHOT/ip-1.3.0-SNAPSHOT.jar
          test -f /tmp/kar-check/repository/org/code-house/bacnet4j/mstp/1.3.0-SNAPSHOT/mstp-1.3.0-SNAPSHOT.jar

          unzip -p /tmp/kar-check/repository/org/code-house/bacnet4j/api/1.3.0-SNAPSHOT/api-1.3.0-SNAPSHOT.jar META-INF/MANIFEST.MF > /tmp/api-manifest.txt
          tr -d '\\r\\n ' < /tmp/api-manifest.txt > /tmp/api-manifest-flat.txt
          echo "=== BACnet4J API manifest ==="
          cat /tmp/api-manifest.txt
          echo "=== flattened BACnet4J enums export ==="
          grep -o 'com.serotonin.bacnet4j.enums;version="[^"]*"' /tmp/api-manifest-flat.txt || true
          grep -q 'com.serotonin.bacnet4j.enums;version="6.1' /tmp/api-manifest-flat.txt

          if find /tmp/kar-check/repository/org/code-house/bacnet4j -path '*1.3.0-beta1*' | grep -q .; then
            echo "ERROR: old bacnet4j-wrapper 1.3.0-beta1 is still packaged"
            exit 1
          fi

          echo "Verified: KAR contains only bacnet4j-wrapper 1.3.0-SNAPSHOT with BACnet4J 6.1.0.beta2 exports"

      - name: Collect KAR and checksum
        working-directory: connectorio-addons
        run: |
          mkdir -p artifacts
          cp kars/org.connectorio.addons.kar.bacnet/target/*.kar artifacts/
          cd artifacts
          sha256sum *.kar > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bacnet-kar-stable-bbmd-foreign-device-r2-2026-09-20
          path: |
            connectorio-addons/artifacts/*.kar
            connectorio-addons/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish corrected GitHub release
        working-directory: connectorio-addons
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: bacnet-stable-bbmd-foreign-device-2026-09-20-r2
          RELEASE_SHA: d6a3bf8a3ffb3cca9d54268a425f7c3f9f306696
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.kar artifacts/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/*.kar artifacts/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "BACnet stable R2: COV + health + BBMD + Foreign Device" \
              --notes "Corrected KAR packaging. Uses ConnectorIO hotfix commit d6a3bf8a3ffb3cca9d54268a425f7c3f9f306696 and bacnet4j-wrapper stable commit 4afe087401b2237f77d79718730997c99bd907c7. The previous KAR incorrectly packaged bacnet4j-wrapper 1.3.0-beta1 / BACnet4J 6.0.0 while the binding required BACnet4J 6.1.x. R2 packages wrapper 1.3.0-SNAPSHOT with BACnet4J 6.1.0-beta.2."
          fi
